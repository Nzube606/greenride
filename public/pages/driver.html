<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenRide — Driver Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
      }
      #map {
        height: 300px;
        width: 100%;
        border-radius: 12px;
        z-index: 1;
      }
      .tab-active {
        border-bottom: 3px solid #16a34a;
        color: #16a34a;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="min-h-screen bg-green-50">
    <header
      class="bg-green-600 text-white px-6 py-4 flex justify-between items-center shadow"
    >
      <div class="flex items-center gap-2">
        <span class="text-2xl">🛺</span>
        <span class="font-bold text-lg">GreenRide</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="driverName" class="text-sm font-medium"></span>
        <button
          onclick="logout()"
          class="text-sm bg-white text-green-700 px-3 py-1 rounded-full font-medium hover:bg-green-50"
        >
          Logout
        </button>
      </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">
      <div
        id="statusBanner"
        class="hidden rounded-xl px-4 py-3 text-sm font-medium"
      ></div>

      <!-- Availability Toggle -->
      <div
        class="bg-white rounded-xl shadow px-6 py-4 flex items-center justify-between"
      >
        <div>
          <p class="text-sm font-semibold text-gray-800">Availability Status</p>
          <p id="availabilityText" class="text-xs text-gray-400 mt-0.5">
            You are currently offline
          </p>
        </div>
        <button
          id="availabilityToggle"
          onclick="toggleAvailability()"
          class="relative inline-flex items-center w-14 h-7 rounded-full transition-colors duration-300 bg-gray-300 focus:outline-none"
        >
          <span
            id="availabilityThumb"
            class="inline-block w-6 h-6 bg-white rounded-full shadow transform transition-transform duration-300 translate-x-0.5"
          ></span>
        </button>
      </div>

      <!-- Tabs -->
      <div class="flex border-b border-gray-200 bg-white rounded-t-xl px-4">
        <button
          onclick="showTab('requests')"
          id="tab-requests"
          class="tab-active px-4 py-3 text-sm mr-4"
        >
          Ride Requests
        </button>
        <button
          onclick="showTab('active')"
          id="tab-active"
          class="px-4 py-3 text-sm text-gray-500 mr-4"
        >
          Active Ride
        </button>
        <button
          onclick="showTab('history')"
          id="tab-history"
          class="px-4 py-3 text-sm text-gray-500 mr-4"
        >
          History
        </button>
      </div>

      <!-- RIDE REQUESTS TAB -->
      <div id="panel-requests" class="bg-white rounded-b-xl shadow p-6">
        <div id="noRequestsMsg" class="text-center py-8">
          <p class="text-3xl mb-2">🛺</p>
          <p class="text-sm text-gray-400">No ride requests yet.</p>
          <p class="text-xs text-gray-300 mt-1">
            Toggle your availability on to start receiving requests.
          </p>
        </div>
        <div id="requestsList" class="space-y-4"></div>
      </div>

      <!-- ACTIVE RIDE TAB -->
      <div
        id="panel-active"
        class="hidden bg-white rounded-b-xl shadow p-6 space-y-4"
      >
        <div id="noActiveRide" class="text-center py-8">
          <p class="text-3xl mb-2">✅</p>
          <p class="text-sm text-gray-400">No active ride at the moment.</p>
        </div>
        <div id="activeRideDetails" class="hidden space-y-4">
          <div
            class="bg-green-50 border border-green-200 rounded-xl p-4 space-y-2"
          >
            <p class="text-sm font-semibold text-green-700">🚗 Active Ride</p>
            <p id="activePassengerName" class="text-sm text-gray-700"></p>
            <p id="activePickup" class="text-sm text-gray-600"></p>
            <p id="activeDestination" class="text-sm text-gray-600"></p>
          </div>
          <div id="map" class="hidden"></div>
          <button
            onclick="completeRide()"
            id="completeBtn"
            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition duration-200"
          >
            Mark Ride as Complete
          </button>
        </div>
      </div>

      <!-- HISTORY TAB -->
      <div id="panel-history" class="hidden bg-white rounded-b-xl shadow p-6">
        <h2 class="text-base font-semibold text-gray-800 mb-4">
          Completed Trips
        </h2>
        <div id="historyList" class="space-y-3">
          <p class="text-sm text-gray-400">Loading...</p>
        </div>
      </div>
    </main>

    <script>
      const API = "https://greenride-backend-7aqt.onrender.com/api";
      const token = localStorage.getItem("greenride_token");
      const user = JSON.parse(localStorage.getItem("greenride_user") || "{}");

      if (!token || user.role !== "driver") {
        window.location.href = "login.html";
      }

      const socket = io("https://greenride-backend-7aqt.onrender.com");

      let isAvailable = localStorage.getItem("driver_available") === "true";
      let currentRideId = null;
      let map = null;
      let passengerMarker = null;
      let locationInterval = null;

      window.addEventListener("load", () => {
        document.getElementById("driverName").textContent = user.fullName || "";
        socket.emit("driver:online", user.id);

        // Restore availability UI from localStorage
        if (isAvailable) {
          updateAvailabilityUI();
        }

        // Check database for active ride
        checkForActiveRide();
      });

      // ── Check for active ride on load ──────────────────────────────────────
      async function checkForActiveRide() {
        try {
          const res = await fetch(`${API}/rides/my-rides`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();

          if (!data.rides) return;

          const activeRide = data.rides.find(
            (r) => r.status === "accepted" || r.status === "in_progress",
          );

          if (activeRide) {
            currentRideId = activeRide._id;
            showActiveRide(
              activeRide.passenger?.fullName || "Passenger",
              activeRide.pickupLocation.description,
              activeRide.destination.description,
              activeRide.pickupLocation.coordinates,
              activeRide.passenger?.phone || "",
            );
            startLocationBroadcast();
            showTab("active");
            showBanner(
              "Welcome back! Your active ride has been restored.",
              "success",
            );
          }

          // Also load pending requests if driver is available
          if (isAvailable && !currentRideId) {
            loadPendingRequests();
          }
        } catch (err) {
          console.error("Error checking active ride:", err);
        }
      }

      const pendingRidesData = {};

      async function loadPendingRequests() {
        try {
          const res = await fetch(`${API}/rides/pending`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();

          if (!data.rides || data.rides.length === 0) return;

          document.getElementById("noRequestsMsg").classList.add("hidden");
          document.getElementById("requestsList").innerHTML = "";

          data.rides.forEach((ride) => {
            pendingRidesData[ride._id] = ride;

            const requestCard = document.createElement("div");
            requestCard.id = `request-${ride._id}`;
            requestCard.className =
              "border border-green-200 rounded-xl p-4 space-y-3 bg-green-50";
            requestCard.innerHTML = `
        <div class="space-y-1">
          <p class="text-sm font-semibold text-gray-800">🧑 ${ride.passengerName}</p>
          <p class="text-sm text-gray-600">📍 <span class="font-medium">Pickup:</span> ${ride.pickupLocation.description}</p>
          <p class="text-sm text-gray-600">🏁 <span class="font-medium">Destination:</span> ${ride.destination.description}</p>
          ${
            ride.pickupLocation.coordinates?.lat
              ? `
            <p class="text-xs text-gray-400">GPS coordinates available</p>
          `
              : ""
          }
        </div>
        <div class="flex gap-3">
          <button
            onclick="acceptRideById('${ride._id}')"
            class="flex-1 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2 rounded-lg transition"
          >
            Accept
          </button>
          <button
            onclick="document.getElementById('request-${ride._id}').remove(); checkEmptyRequests();"
            class="flex-1 border border-gray-300 text-gray-600 text-sm font-medium py-2 rounded-lg hover:bg-gray-50 transition"
          >
            Decline
          </button>
        </div>
      `;
            document.getElementById("requestsList").prepend(requestCard);
          });
        } catch (err) {
          console.error("Error loading pending requests:", err);
        }
      }

      async function acceptRideById(rideId) {
        const ride = pendingRidesData[rideId];
        if (!ride) return;
        await acceptRide(
          rideId,
          ride.passengerName,
          ride.pickupLocation.description,
          ride.destination.description,
          ride.pickupLocation.coordinates || null,
          ride.passenger?.phone || "",
        );
      }
      async function acceptRideFromSocket(rideId) {
        const rideData = socketRidesData[rideId];
        if (!rideData) return;
        await acceptRide(
          rideId,
          rideData.passengerName,
          rideData.pickup,
          rideData.destination,
          rideData.pickupCoords || null,
          "",
        );
      }
      // ── Tab switching ──────────────────────────────────────────────────────
      function showTab(tab) {
        ["requests", "active", "history"].forEach((t) => {
          document.getElementById(`panel-${t}`).classList.add("hidden");
          document.getElementById(`tab-${t}`).classList.remove("tab-active");
          document.getElementById(`tab-${t}`).classList.add("text-gray-500");
        });
        document.getElementById(`panel-${tab}`).classList.remove("hidden");
        document.getElementById(`tab-${tab}`).classList.add("tab-active");
        document.getElementById(`tab-${tab}`).classList.remove("text-gray-500");
        if (tab === "history") loadHistory();
      }

      // ── Availability toggle ────────────────────────────────────────────────
      async function toggleAvailability() {
        try {
          const res = await fetch(`${API}/users/availability`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}` },
          });

          const data = await res.json();

          if (!res.ok) {
            showBanner(data.message, "error");
            return;
          }

          isAvailable = data.isAvailable;
          localStorage.setItem("driver_available", isAvailable);
          updateAvailabilityUI();
          showBanner(data.message, "success");

          if (isAvailable) {
            socket.emit("driver:online", user.id);
            loadPendingRequests();
          }
        } catch (err) {
          showBanner("Error updating availability", "error");
        }
      }

      function updateAvailabilityUI() {
        const toggle = document.getElementById("availabilityToggle");
        const thumb = document.getElementById("availabilityThumb");
        const text = document.getElementById("availabilityText");

        if (isAvailable) {
          toggle.classList.remove("bg-gray-300");
          toggle.classList.add("bg-green-500");
          thumb.classList.remove("translate-x-0.5");
          thumb.classList.add("translate-x-7");
          text.textContent = "You are online and receiving requests";
          text.classList.remove("text-gray-400");
          text.classList.add("text-green-600");
        } else {
          toggle.classList.remove("bg-green-500");
          toggle.classList.add("bg-gray-300");
          thumb.classList.remove("translate-x-7");
          thumb.classList.add("translate-x-0.5");
          text.textContent = "You are currently offline";
          text.classList.remove("text-green-600");
          text.classList.add("text-gray-400");
        }
      }

      // ── Socket — receive ride request ──────────────────────────────────────
      const socketRidesData = {};
      socket.on("ride:new_request", (rideData) => {
        if (!isAvailable || currentRideId) return;

        document.getElementById("noRequestsMsg").classList.add("hidden");
        socketRidesData[rideData.rideId] = rideData;

        const requestCard = document.createElement("div");
        requestCard.id = `request-${rideData.rideId}`;
        requestCard.className =
          "border border-green-200 rounded-xl p-4 space-y-3 bg-green-50";
        requestCard.innerHTML = `
        <div class="space-y-1">
          <p class="text-sm font-semibold text-gray-800">🧑 ${rideData.passengerName}</p>
          <p class="text-sm text-gray-600">📍 <span class="font-medium">Pickup:</span> ${rideData.pickup}</p>
          <p class="text-sm text-gray-600">🏁 <span class="font-medium">Destination:</span> ${rideData.destination}</p>
          ${
            rideData.pickupCoords && rideData.pickupCoords.lat
              ? `
            <p class="text-xs text-gray-400">GPS coordinates available</p>
          `
              : ""
          }
        </div>
        <div class="flex gap-3">
          <button
           onclick="acceptRideFromSocket('${rideData.rideId}')"
            class="flex-1 bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2 rounded-lg transition"
          >
            Accept
          </button>
          <button
            onclick="document.getElementById('request-${rideData.rideId}').remove(); checkEmptyRequests();"
            class="flex-1 border border-gray-300 text-gray-600 text-sm font-medium py-2 rounded-lg hover:bg-gray-50 transition"
          >
            Decline
          </button>
        </div>
      `;

        document.getElementById("requestsList").prepend(requestCard);
      });

      // ── Accept ride ────────────────────────────────────────────────────────
      async function acceptRide(
        rideId,
        passengerName,
        pickup,
        destination,
        pickupCoords,
        passengerPhone,
      ) {
        try {
          const res = await fetch(`${API}/rides/${rideId}/accept`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}` },
          });

          const data = await res.json();

          if (!res.ok) {
            showBanner(data.message, "error");
            document.getElementById(`request-${rideId}`)?.remove();
            checkEmptyRequests();
            return;
          }

          currentRideId = rideId;

          socket.emit("ride:accept", {
            rideId,
            driverName: user.fullName,
            driverPhone: user.phone,
          });

          document.getElementById("requestsList").innerHTML = "";
          checkEmptyRequests();

          showActiveRide(
            passengerName,
            pickup,
            destination,
            pickupCoords,
            passengerPhone,
          );
          startLocationBroadcast();
          showBanner("Ride accepted! Navigate to the pickup point.", "success");
          showTab("active");
        } catch (err) {
          showBanner("Error accepting ride", "error");
        }
      }

      // ── Show active ride panel ─────────────────────────────────────────────
      function showActiveRide(
        passengerName,
        pickup,
        destination,
        pickupCoords,
        passengerPhone,
      ) {
        document.getElementById("noActiveRide").classList.add("hidden");
        document.getElementById("activeRideDetails").classList.remove("hidden");
        document.getElementById("activePassengerName").textContent =
          `Passenger: ${passengerName}`;
        document.getElementById("activePickup").textContent =
          `📍 Pickup: ${pickup}`;
        document.getElementById("activeDestination").textContent =
          `🏁 Destination: ${destination}`;

        // Only show map if passenger used GPS
        if (pickupCoords && pickupCoords.lat) {
          document.getElementById("map").classList.remove("hidden");
          setTimeout(() => {
            if (map) {
              map.remove();
              map = null;
            }
            map = L.map("map").setView(
              [pickupCoords.lat, pickupCoords.lng],
              16,
            );
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              attribution: "© OpenStreetMap contributors",
            }).addTo(map);

            passengerMarker = L.marker([pickupCoords.lat, pickupCoords.lng], {
              icon: L.divIcon({
                className: "",
                html: '<div style="font-size:22px">🧑</div>',
                iconSize: [30, 30],
              }),
            })
              .addTo(map)
              .bindPopup(`Pickup: ${passengerName}`)
              .openPopup();
          }, 200);
        } else {
          document.getElementById("map").classList.add("hidden");
        }
      }
      // ── Socket events ──────────────────────────────────────────────────────
      socket.on("ride:cancelled", (data) => {
        const card = document.getElementById(`request-${data.rideId}`);
        if (card) {
          card.remove();
          checkEmptyRequests();
          showBanner("A passenger cancelled their ride request.", "error");
        }

        if (data.rideId === currentRideId) {
          currentRideId = null;
          stopLocationBroadcast();
          document.getElementById("activeRideDetails").classList.add("hidden");
          document.getElementById("noActiveRide").classList.remove("hidden");
          if (map) {
            map.remove();
            map = null;
          }
          showBanner("The passenger cancelled the ride.", "error");
          showTab("requests");
        }
      });
      // ── Location broadcasting ──────────────────────────────────────────────
      function startLocationBroadcast() {
        if (!navigator.geolocation) return;
        if (locationInterval) return;

        locationInterval = setInterval(() => {
          navigator.geolocation.getCurrentPosition((pos) => {
            socket.emit("driver:location", {
              rideId: currentRideId,
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              driverName: user.fullName,
            });
          });
        }, 1000);
      }

      function stopLocationBroadcast() {
        if (locationInterval) {
          clearInterval(locationInterval);
          locationInterval = null;
        }
      }

      // ── Complete ride ──────────────────────────────────────────────────────
      async function completeRide() {
        if (!currentRideId) return;

        try {
          const res = await fetch(`${API}/rides/${currentRideId}/complete`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!res.ok) {
            showBanner("Error completing ride", "error");
            return;
          }

          socket.emit("ride:complete", { rideId: currentRideId });
          stopLocationBroadcast();
          currentRideId = null;

          document.getElementById("activeRideDetails").classList.add("hidden");
          document.getElementById("noActiveRide").classList.remove("hidden");

          if (map) {
            map.remove();
            map = null;
          }

          showBanner(
            "Ride completed successfully. Please collect payment from passenger.",
            "success",
          );
          showTab("requests");
        } catch (err) {
          showBanner("Error completing ride", "error");
        }
      }

      // ── History ────────────────────────────────────────────────────────────
      async function loadHistory() {
        try {
          const res = await fetch(`${API}/rides/my-rides`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          const list = document.getElementById("historyList");

          if (!data.rides || data.rides.length === 0) {
            list.innerHTML =
              '<p class="text-sm text-gray-400">No completed trips yet.</p>';
            return;
          }

          list.innerHTML = data.rides
            .map(
              (ride) => `
          <div class="border border-gray-100 rounded-xl p-4 space-y-1">
            <div class="flex justify-between items-center">
              <span class="text-sm font-medium text-gray-800">${ride.pickupLocation.description} → ${ride.destination.description}</span>
              <span class="text-xs px-2 py-1 rounded-full font-medium ${statusColor(ride.status)}">${ride.status}</span>
            </div>
            <p class="text-xs text-gray-500">Passenger: ${ride.passenger?.fullName || "Unknown"}</p>
            <p class="text-xs text-gray-400">${new Date(ride.createdAt).toLocaleString()}</p>
          </div>
        `,
            )
            .join("");
        } catch (err) {
          document.getElementById("historyList").innerHTML =
            '<p class="text-sm text-red-400">Error loading history.</p>';
        }
      }

      // ── Helpers ────────────────────────────────────────────────────────────
      function checkEmptyRequests() {
        const list = document.getElementById("requestsList");
        if (list.children.length === 0) {
          document.getElementById("noRequestsMsg").classList.remove("hidden");
        }
      }

      function showBanner(msg, type) {
        const banner = document.getElementById("statusBanner");
        banner.textContent = msg;
        banner.className = `rounded-xl px-4 py-3 text-sm font-medium ${type === "success" ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`;
        banner.classList.remove("hidden");
        setTimeout(() => banner.classList.add("hidden"), 6000);
      }

      function statusColor(status) {
        const colors = {
          pending: "bg-yellow-100 text-yellow-700",
          accepted: "bg-blue-100 text-blue-700",
          in_progress: "bg-purple-100 text-purple-700",
          completed: "bg-green-100 text-green-700",
          cancelled: "bg-red-100 text-red-700",
        };
        return colors[status] || "bg-gray-100 text-gray-700";
      }

      function logout() {
        stopLocationBroadcast();
        localStorage.removeItem("driver_available");
        localStorage.removeItem("greenride_token");
        localStorage.removeItem("greenride_user");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
