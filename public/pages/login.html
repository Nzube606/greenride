<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenRide — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-green-50 flex items-center justify-center px-4">
    <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-8">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-16 h-16 bg-green-600 rounded-full mb-4"
        >
          <span class="text-white text-3xl">🛺</span>
        </div>
        <h1 class="text-2xl font-bold text-green-700">GreenRide</h1>
        <p class="text-gray-500 text-sm mt-1">
          Smart Campus Mobility — UniPort
        </p>
      </div>

      <!-- Error message -->
      <div
        id="errorMsg"
        class="hidden bg-red-100 text-red-700 text-sm rounded-lg px-4 py-3 mb-4"
      ></div>

      <!-- Form -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
            required
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 pr-12"
              required
            />
            <button
              type="button"
              onclick="togglePassword('password', 'eyeIcon1')"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none"
            >
              <span id="eyeIcon1">👁️</span>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="loginBtn"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 rounded-lg transition duration-200"
        >
          Login
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account?
        <a
          href="register.html"
          class="text-green-600 font-medium hover:underline"
          >Register here</a
        >
      </p>
    </div>

    <script>
      const API = "https://greenride-backend-7aqt.onrender.com/api";

      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
          const errorMsg = document.getElementById("errorMsg");
          const loginBtn = document.getElementById("loginBtn");

          errorMsg.classList.add("hidden");
          loginBtn.textContent = "Logging in...";
          loginBtn.disabled = true;

          try {
            const res = await fetch(`${API}/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (!res.ok) {
              errorMsg.textContent = data.message;
              errorMsg.classList.remove("hidden");
              loginBtn.textContent = "Login";
              loginBtn.disabled = false;
              return;
            }

            // Save token and user to localStorage
            localStorage.setItem("greenride_token", data.token);
            localStorage.setItem("greenride_user", JSON.stringify(data.user));

            // Redirect based on role
            if (data.user.role === "passenger") {
              window.location.href = "passenger.html";
            } else if (data.user.role === "driver") {
              window.location.href = "driver.html";
            } else if (data.user.role === "admin") {
              window.location.href = "admin.html";
            }
          } catch (err) {
            errorMsg.textContent =
              "Unable to connect to server. Please try again.";
            errorMsg.classList.remove("hidden");
            loginBtn.textContent = "Login";
            loginBtn.disabled = false;
          }
        });
      function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
          input.type = "text";
          icon.textContent = "🙈";
        } else {
          input.type = "password";
          icon.textContent = "👁️";
        }
      }
    </script>
  </body>
</html>
